server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:0.0.0.0}
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: securex-backend
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/securexdb;AUTO_SERVER=TRUE;MODE=PostgreSQL}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

securex:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
  storage:
    path: ${FILE_STORAGE_PATH:./uploads}
  public-base-url: ${PUBLIC_BASE_URL:${RENDER_EXTERNAL_URL:${PUBLIC_URL:${APP_BASE_URL:}}}}
  frontend-url: ${FRONTEND_URL:${PUBLIC_BASE_URL:${RENDER_EXTERNAL_URL:${PUBLIC_URL:${APP_BASE_URL:}}}}}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    root: INFO
    com.securex: DEBUG
    org.springframework.security: INFO
